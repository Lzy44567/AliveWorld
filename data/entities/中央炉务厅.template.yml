name: 中央炉务厅
description: 管理地炉、热票、主干管线和紧急状态的制度型暗流实体。它由工程派、秩序派和依附配额获利的人组成，不是统一人格。
motive: 在停炉与灰潮重叠的窗口维持城市运转，并阻止未经解释的原始数据引发挤兑；内部一部分人还要掩盖过去的产能造假。
status: 已发现第七中继站的黑匣重新上线，正在核对值守权限，但尚未确认玩家是否读取或复制数据。
recent_actions:
  - 将下环三处备用热罐列为紧急征用候选，但命令尚未送达现场。
plans:
  - 派温岑进行有限审计，同时准备在证据外泄时切断第七站的远程广播权限。
  - 根据灰潮观测决定优先保障过滤塔还是下环温室。
mechanisms:
  - 调度令必须经过签名、传令和现场执行，不能瞬间作用于全城。
  - 炉务厅可以封锁公开线路和冻结热票，却无法抹去已经复制或由人记住的证据。
triggers:
  - condition: 玩家公开黑匣内容或向多个组织提供副本
    result: 炉务厅启动来源调查、舆情控制与替代调度，并在因果账本留下持续影响
  - condition: 下环供热跌破安全线
    result: 内部围绕征用、疏散和公开真实产能产生分裂行动
relationships:
  温岑: 有限授权与内部监控并存
  下环互助会: 必须合作但互不信任
  玩家: 待确认的关键证据持有人
importance: 0.9
is_active: true
is_template: true

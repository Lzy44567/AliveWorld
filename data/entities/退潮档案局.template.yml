name: 退潮档案局
description: 维持雾港潮汐秩序、管理危险回声的制度型暗流实体。内部并非铁板一块：秩序派优先避免恐慌，求真派希望公开被错误封存的记录。
motive: 在不引发港口停摆的前提下控制异常回声，并查清“未来寄件”是否意味着钟印系统被人伪造。
status: 夜班已经发现一枚废止钟印重新出现，但尚未确认持有者与包裹内容。
recent_actions: []
plans:
  - 对废止钟印启动低调复核，先查记录再决定是否公开通缉。
  - 观察岚灯是否绕过正式程序接触相关回声。
mechanisms:
  - 港区通行牌会留下钟印记录，但记录可能延迟、缺失或被内部人员修改。
  - 档案局可封存公开回声窗口，却无法删除已经发生过的原始声音。
triggers:
  - condition: 包裹或废止钟印在公开场合被展示
    result: 档案局提高调查等级，并留下可被玩家察觉的跟踪迹象
relationships:
  岚灯: 谨慎信任
  玩家: 尚未定性
importance: 0.72
is_active: true
is_template: true

name: 下环互助会
description: 由热棚管理员、炉管工、医护和街区信使组成的社区网络。它能组织维修、分配物资和集体谈判，但不同街区对公开证据、抢热和撤离有不同意见。
motive: 让下环居民安全度过停炉与灰潮重叠期，并争取透明、可核验的热量分配。
status: 三片住宅区的实际热压低于公告，互助会正在核对是管线故障、提前限流还是有人偷接。
recent_actions:
  - 苏弦已调集两支维修组和公共热棚库存，暂未发动集体停工。
plans:
  - 要求第七中继站开放实时压力读数，并依据玩家回应决定合作、占站或另寻旁路。
  - 若确认炉务厅隐瞒供热能力，组织分区谈判而非立刻发动无差别骚乱。
mechanisms:
  - 社区动员依赖信任、具体证据和各热棚之间的信使网络。
  - 互助会能快速修复支管，却没有能力独立维持主管线或过滤塔。
triggers:
  - condition: 玩家提供可核验的压力数据并保护维修组
    result: 互助会提高合作等级，建立共享观测与应急维修的持续影响
  - condition: 玩家协助秘密抽走居民供热或作出承诺后反悔
    result: 社区信任下降，通行、消息和人手支持逐步收紧
relationships:
  苏弦: 现场协调人
  中央炉务厅: 依赖其技术又质疑其统计
  玩家: 可争取的中继站值守员
importance: 0.86
is_active: true
is_template: true

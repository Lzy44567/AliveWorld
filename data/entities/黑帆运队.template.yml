name: 黑帆运队
description: 往返城外观测站、废弃矿井与下环市场的松散运输网络。他们既走私也承担官方路线无法覆盖的救援，成员受利润、人情和生存分别驱动。
motive: 在灰潮封路前运入过滤芯并保存旧货运井的控制权；避免炉务厅借紧急状态彻底接管非正式路线。
status: 一支携带过滤芯的车队失去联系，砾怀疑公开道路的灰潮数据被延迟发布。
recent_actions:
  - 暂停两条外环路线，将可用车辆集中到旧货运井附近。
plans:
  - 以地下支线情报交换第七站通行签或可靠的灰潮时刻表。
  - 若官方开始封井，转移关键物资并留下误导性的空仓记录。
mechanisms:
  - 运队的影响通过路线、驾驶员、仓点和交易关系实现，不能凭空出现在封锁区。
  - 成员会评估风险和信誉；一次公平交易不能保证永久忠诚，一次冲突也不代表所有成员敌对。
triggers:
  - condition: 玩家开放旧货运支线或提供可信观测数据
    result: 运队改变车队路线，可能把过滤芯、难民或追踪者带入下环
  - condition: 炉务厅封锁旧货运井
    result: 运队分裂为撤离、谈判和强行突围三种行动倾向
relationships:
  砾: 可靠但有自主判断的领路人
  下环互助会: 长期交易与互相戒备
  玩家: 潜在路线合作者
importance: 0.76
is_active: true

name: 灰潮迁徙
description: 代表灰潮推进、边地居民迁徙、过滤材料消耗和交通条件变化的世界推演实体。它不是天灾人格、世界意志或幕后反派。
motive: 依据世界书中的自然与社会规则推演灰潮及迁徙带来的长期变化；只有变化会留下可遭遇的持续后果时才建立因果账单。
status: 观测塔预计主灰带在十八至三十小时内扫过西侧道路，误差仍很大；已有零散迁徙者提前抵达城门。
recent_actions: []
plans:
  - 随时间、风向和玩家引发的交通变化更新道路、过滤塔负荷与迁徙规模。
  - 避免为了刺激剧情让灰潮突然转向玩家；变化必须能追溯到观测、天气或既有行动。
mechanisms:
  - 灰潮影响机械磨损、空气质量、日照和道路能见度；迁徙影响住房、物资、劳动和社会关系。
  - 小幅变化可保持沉默，只有跨区域或持续影响才进入因果账本。
triggers:
  - condition: 世界时间推进、观测数据改变或主要路线被开放/封闭
    result: 更新灰潮与迁徙的倾向，并在必要时创建可由正文兑现的环境影响
relationships:
  玩家: 不围绕玩家运行的间接变量
importance: 0.82
is_active: true
is_template: true
tags: [模板, 官方世界, 世界推演, 系统型实体, 烬环城]

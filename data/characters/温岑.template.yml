name: 温岑
description: 炉务厅的年轻审计工程师，擅长从调度签名和压力曲线找出矛盾。她相信制度仍可修复，却已经察觉上级在隐瞒真实产能。她会要求证据链、主动联系旧同事并承担自己的选择，但不会替玩家决定是否公开黑匣。外表冷静，压力大时会反复整理袖口的铜扣。
starting_scene: 停炉前夜，温岑带着一份临时审计令来到第七中继站；她的命令编号真实，但授权范围被人刻意写得含糊。

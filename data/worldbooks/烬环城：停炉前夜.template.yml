name: 烬环城：停炉前夜
overview: 烬环城建在一座仍有余热的古代地炉周围。城内的供热、交通、食物与政治权力都依赖炉网配额；城外灰潮正迫使边地居民迁入。玩家是下环第七中继站的新任值守员，在停炉检修前夜收到一份证明炉务厅长期篡改产能数据的原始记录。它可能揭开真相，也可能在最糟的时刻击穿整座城市的信任。
axioms:
  - 地炉只能转移和释放已有热量，不能凭意志凭空产生能源；任何额外供热都必须有来源、代价和传输路径。
  - 炉网由相互依赖的中继站组成。局部停机、抢修、偷接或配额调整会沿网络传播，但结果取决于位置、时差和备用线路。
  - 各势力掌握的信息有限且可能撒谎、误判或隐瞒；一次搜查失败、官方否认或统计缺失都不能证明某事绝对不存在。
  - 玩家可以声明自己的行动、过去和持有物；外部世界如何回应仍需依据既有事实、证据与可行性裁定，不能替玩家决定关键选择。
entries:
  - id: entry_ash_ring_furnace_grid
    name: 地炉与九环炉网
    keys: 地炉,炉网,中继站,供热,热压,停炉
    content: 城市由内向外分为九个供热环。越靠内环，热压越稳定；下环依赖长距离旧管道和夜间配额。第七中继站控制三片住宅区、一座温室和旧货运线。停炉检修每年发生一次，备用热罐只能维持关键设施约六小时。
    tags: [常驻, 绝对规则, 基础设施]
    is_active: true
  - id: entry_ash_ring_governance
    name: 炉务厅与热票制度
    keys: 炉务厅,热票,配额,审计,议会
    content: 中央炉务厅负责分配热票、维护主管线并公布产能。热票既是能源凭证也是事实上的城市货币。紧急状态下炉务厅可临时征用民用热量，但必须留下可审计的调度记录；伪造记录会动摇其合法性。
    tags: [制度, 常驻, 政治]
    is_active: true
  - id: entry_ash_ring_lower_district
    name: 下环生活
    keys: 下环,温室,热棚,冻巷,居民
    content: 下环居民用公共热棚度过低温时段，家庭会共享热票、修补保温层并私接细管。这里并非只有贫困与犯罪，也有成熟的互助网络、工匠文化和对内环统计的不信任。
    tags: [社会, 地区]
    is_active: true
  - id: entry_ash_ring_ash_tide
    name: 灰潮
    keys: 灰潮,灰暴,迁徙,城外,过滤塔
    content: 灰潮是受季风推动的高浓度火山尘带，会磨损机械、污染水源并降低日照。它不是有意志的怪物。灰潮逼近会带来边地迁徙、过滤材料短缺和交通中断，其强度可由观测塔提前估计但不能精确到分钟。
    tags: [自然规则, 灾害, 常驻]
    is_active: true
  - id: entry_ash_ring_seventh_relay
    name: 第七中继站
    keys: 第七中继站,七号站,值守员,原始记录,黑匣
    content: 第七中继站建于旧货运井上方，既能调节下环热压，也连着一条已从公开图纸删除的维修支线。玩家持有的黑匣记录了过去三年的原始炉压与调度签名；记录本身不能说明每次异常的动机，需要与维护日志和现场证据交叉验证。
    tags: [剧情核心, 地点, 证据]
    is_active: true
  - id: entry_ash_ring_public_order
    name: 紧急状态与公共秩序
    keys: 紧急状态,封锁,宵禁,疏散,征用
    content: 当炉压或灰潮风险超过阈值，炉务厅可分区封锁、征用热罐并优先保障医院、温室与过滤塔。执行者并非自动邪恶，但不透明的优先级会制造真实伤害。任何命令都需要人员、路线和时间才能落实。
    tags: [制度, 冲突规则]
    is_active: true
  - id: entry_ash_ring_information
    name: 消息、证据与谣言
    keys: 广播,谣言,证据,黑匣,公开
    content: 城内依靠炉线广播和人工信使传递消息。公开一份证据会提高关注，也会让相关方有机会质疑来源、追查持有人或抢先调整策略；隐藏证据则保留主动权，但可能让其他人继续依据错误数据行动。
    tags: [信息规则, 常驻]
    is_active: true
  - id: entry_ash_ring_factions
    name: 三条组织网络
    keys: 互助会,黑帆运队,炉务厅,组织,势力
    content: 炉务厅掌握制度、工程人员与公开记录；下环互助会掌握社区信任、工匠和热棚网络；黑帆运队掌握旧货运井、城外路线与非正式交易。三方内部都有分歧，会合作、交换、误判或背叛，不应被写成整齐划一的善恶阵营。
    tags: [势力, 常驻]
    is_active: true
